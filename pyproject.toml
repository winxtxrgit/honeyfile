[build-system]
# Cap hatchling below 1.28: 1.28+ emits Metadata-Version 2.5, which no released
# twine yet understands, so `twine check --strict` in release.yml rejects the
# build. 1.27 emits 2.4 (same PEP 639 License-Expression) and passes. Lift the
# ceiling once twine supports metadata 2.5.
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "honeyfile"
dynamic = ["version"]
description = "Plant decoy files and get alerted the moment ransomware or an intruder touches them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Thanut Jongteerathanachote" }]
keywords = ["security", "ransomware", "honeypot", "canary", "decoy", "blue-team", "detection", "incident-response"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
honeyfile = "honeyfile.cli:main"

[project.urls]
Homepage = "https://github.com/winxtxrgit/honeyfile"
Issues = "https://github.com/winxtxrgit/honeyfile/issues"

[tool.hatch.version]
path = "src/honeyfile/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
